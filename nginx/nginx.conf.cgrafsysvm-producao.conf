worker_processes  1;

events {
    worker_connections  1024;
}

# Demux TLS :443 por SNI (nao ALPN — proxy corporativo na borda nao envia ALPN)
# cgrafsysvm.camara.leg.br -> HTTPS :8443 | turn.cgrafsysvm.camara.leg.br -> eturnal :5349
# Ver nginx/sharescreen-turns-443-stream.inc
stream {
    map_hash_bucket_size 128;

    # h2/http1.1 -> HTTPS; vazio -> TURN (WebRTC). turn.* -> TURN (quando DNS existir)
    map "$ssl_preread_server_name:$ssl_preread_alpn_protocols" $tls443_backend {
        ~^turn\.cgrafsysvm\.camara\.leg\.br:   127.0.0.1:5349;
        ~:h2$                                   127.0.0.1:8443;
        ~:http/1\.1$                            127.0.0.1:8443;
        default                                 127.0.0.1:5349;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass $tls443_backend;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    error_log  logs/error.log warn;
    access_log  logs/access.log;

    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_names_hash_bucket_size 128;

    # ShareScreen (Node em 127.0.0.1:3443 — start-producao.bat)
    upstream sharescreen_node {
        server 127.0.0.1:3443;
        keepalive 8;
    }

    # SAGRA Web novo (React + FastAPI — porta no config/.env, ex.: 8050)
    upstream sagra_backend {
        server 127.0.0.1:8050;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # XAMPP Apache (SAAGI, estoque) — migrado da porta 80 para 8080; escuta em 10.1.1.73
    upstream xampp_apache {
        server 10.1.1.73:8080;
        keepalive 8;
    }

    map $upstream_http_content_type $sagra_html_no_cache {
        default "";
        "~*text/html" "no-cache, no-store, must-revalidate";
    }

    # WebSocket upgrade (ShareScreen /ws e demais proxies com Upgrade)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- HTTPS (8443 interno; exposto via stream :443) - alias curto cgrafsysvm -> redecamara ---
    server {
        listen 127.0.0.1:8443 ssl;
        server_name cgrafsysvm;

        ssl_certificate     C:/nginx/conf/ssl/cgrafsysvm-interno-chain.crt;
        ssl_certificate_key C:/nginx/conf/ssl/cgrafsysvm-interno.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        return 301 https://cgrafsysvm.redecamara.camara.gov.br$request_uri;
    }

    # --- HTTPS (8443 interno) - Rede interna: SAGRA Web + demais apps ---
    server {
        listen 127.0.0.1:8443 ssl;
        server_name 10.1.1.73 cgrafsysvm.redecamara.camara.gov.br;

        ssl_certificate     C:/nginx/conf/ssl/cgrafsysvm-chain.crt;
        ssl_certificate_key C:/nginx/conf/ssl/cgrafsysvm.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        client_max_body_size 50M;

        include cgrafsysvm-email-images.conf;
        include cgrafsysvm-apps-locations.conf;
    }

    # --- HTTPS (8443 interno) - Internet: ShareScreen + SAGRA Web ---
    server {
        listen 127.0.0.1:8443 ssl;
        server_name cgrafsysvm.camara.leg.br;

        ssl_certificate     C:/nginx/conf/ssl/cgrafsysvm-leg-chain.crt;
        ssl_certificate_key C:/nginx/conf/ssl/cgrafsysvm-leg.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        client_max_body_size 50M;

        include cgrafsysvm-sharescreen-internet-locations.conf;
        include cgrafsysvm-block-internet-apps.conf;
        include cgrafsysvm-sagra-locations.conf;
        include cgrafsysvm-email-images.conf;
        include cgrafsysvm-sagra-spa.conf;
    }

    # --- HTTP (porta 80) - Redireciona tudo para HTTPS ---
    server {
        listen 80;
        server_name cgrafsysvm;
        return 301 https://cgrafsysvm.redecamara.camara.gov.br$request_uri;
    }

    server {
        listen 80;
        server_name 10.1.1.73 cgrafsysvm.redecamara.camara.gov.br cgrafsysvm.camara.leg.br;
        return 301 https://$host$request_uri;
    }
}
