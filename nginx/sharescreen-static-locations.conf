# Trecho ShareScreen para cgrafsysvm-apps-locations.conf
# Incluir no bloco SHARESCREEN (apos /meet, antes do include sagra)

        # CSS/JS compartilhados (index.html usa /shared/theme.css — nao fica sob /host/)
        location ^~ /shared/ {
            proxy_pass https://sharescreen_node/shared/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ^~ /vendor/ {
            proxy_pass https://sharescreen_node/vendor/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
        }

        location = /ws {
            proxy_pass https://sharescreen_node/ws;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location = /api/link-externo {
            proxy_pass https://sharescreen_node/api/link-externo;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
            proxy_set_header X-Host-Token $http_x_host_token;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /api/info {
            proxy_pass https://sharescreen_node/api/info;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
        }

        location = /api/registro-cliente {
            proxy_pass https://sharescreen_node/api/registro-cliente;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
        }

        location ^~ /api/lower-third {
            proxy_pass https://sharescreen_node/api/lower-third;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
            client_max_body_size 256m;
        }

        location ^~ /lt-videos/ {
            proxy_pass https://sharescreen_node/lt-videos/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
        }

        location ^~ /api/gravacao {
            proxy_pass https://sharescreen_node/api/gravacao;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host cgrafsysvm;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host cgrafsysvm;
            client_max_body_size 4g;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
