        # ShareScreen — internet (cgrafsysvm.camara.leg.br)
        # Apenas espectadores com link gerado (?token=...). Host/client internos bloqueados.
        # WebRTC (UDP/TCP 40000-40100) nao passa por este proxy — libere no firewall/NAT
        # e configure PUBLIC_ANNOUNCED_IP no Node (IP publico alcancavel na internet).
        # TURN/TURNS: ver nginx/sharescreen-turns-443-stream.inc e DEPLOY_MAP.md

        location ^~ /host {
            return 404;
        }

        location ^~ /client {
            return 404;
        }

        location = /meet/style.css {
            proxy_pass https://sharescreen_node/client/style.css;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /meet/app.bundle.js {
            proxy_pass https://sharescreen_node/client/app.bundle.js;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /meet/app.bundle.js.map {
            proxy_pass https://sharescreen_node/client/app.bundle.js.map;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /meet {
            if ($arg_token = "") {
                return 403;
            }
            return 301 /meet/$is_args$args;
        }

        location ^~ /meet/ {
            if ($arg_token = "") {
                return 403;
            }
            rewrite ^/meet/(.*)$ /client/$1 break;
            proxy_pass https://sharescreen_node;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ^~ /shared/ {
            proxy_pass https://sharescreen_node/shared/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        location ^~ /vendor/ {
            proxy_pass https://sharescreen_node/vendor/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /ws {
            proxy_pass https://sharescreen_node/ws;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location = /api/info {
            proxy_pass https://sharescreen_node/api/info;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /api/registro-cliente {
            proxy_pass https://sharescreen_node/api/registro-cliente;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        location ^~ /api/lower-third {
            proxy_pass https://sharescreen_node/api/lower-third;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            client_max_body_size 256m;
        }

        location ^~ /lt-videos/ {
            proxy_pass https://sharescreen_node/lt-videos/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
