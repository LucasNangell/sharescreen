worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    error_log  logs/error.log debug;
    access_log  logs/access.log;

    sendfile        on;
    keepalive_timeout  65;

    # ShareScreen (Node em 127.0.0.1:3443 — start-producao.bat)
    upstream sharescreen_node {
        server 127.0.0.1:3443;
        keepalive 8;
    }

    server {
        listen 80;
        server_name cgrafsysvm;
        client_max_body_size 10M;
        # --- SISTEMA 1: SAGRA (Mantido como está) ---
        root C:/SagraWeb; # Root padrão do servidor
        
        location = / {
            try_files /index.html =404;
        }
        
	location /producao {
	    alias "C:\sagraweb";
            index dashboard_global.html;
            try_files $uri $uri/ /dashboard_global.html;
	}

        # SAAGI: proxy para Apache :8080 e reescrita de URLs (:8080 -> :80)
        location /saagi {
            proxy_pass http://127.0.0.1:8080/saagi/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_redirect http://127.0.0.1:8080/saagi/ /saagi/;
            proxy_redirect http://cgrafsysvm:8080/saagi/ /saagi/;
            proxy_redirect http://localhost:8080/saagi/ /saagi/;

            # Desativa gzip do backend para o sub_filter reescrever o corpo
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript;
            sub_filter 'http://cgrafsysvm:8080/saagi//' 'http://cgrafsysvm/saagi/';
            sub_filter 'http://cgrafsysvm:8080/saagi/' 'http://cgrafsysvm/saagi/';
            sub_filter 'http://127.0.0.1:8080/saagi//' 'http://cgrafsysvm/saagi/';
            sub_filter 'http://127.0.0.1:8080/saagi/' 'http://cgrafsysvm/saagi/';
            sub_filter 'http://localhost:8080/saagi//' 'http://cgrafsysvm/saagi/';
            sub_filter 'http://localhost:8080/saagi/' 'http://cgrafsysvm/saagi/';
        }

        # ALMOX: proxy para Apache :8080 e reescrita de URLs (:8080 -> :80)
        location /estoque {
            proxy_pass http://127.0.0.1:8080/estoque/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_redirect http://127.0.0.1:8080/estoque/ /estoque/;
            proxy_redirect http://cgrafsysvm:8080/estoque/ /estoque/;
            proxy_redirect http://localhost:8080/estoque/ /estoque/;

            # Desativa gzip do backend para o sub_filter reescrever o corpo
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript;
            sub_filter 'http://cgrafsysvm:8080/estoque//' 'http://cgrafsysvm/estoque/';
            sub_filter 'http://cgrafsysvm:8080/estoque/' 'http://cgrafsysvm/estoque/';
            sub_filter 'http://127.0.0.1:8080/estoque//' 'http://cgrafsysvm/estoque/';
            sub_filter 'http://127.0.0.1:8080/estoque/' 'http://cgrafsysvm/estoque/';
            sub_filter 'http://localhost:8080/estoque//' 'http://cgrafsysvm/estoque/';
            sub_filter 'http://localhost:8080/estoque/' 'http://cgrafsysvm/estoque/';
        }
        # --- SISTEMA 2: CONTROLE OBS (NOVO) ---r
        
        # 1. Frontend (Arquivos Estáticos)
        location /obs {
            alias "C:\ControleWeb\frontend\dist";
            index index.html;
            try_files $uri $uri/ /obs/index.html;
        }
	

        # 2. Backend API (Proxy para o Python)
        location /api {
            proxy_pass http://127.0.0.1:4040;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

                # --- SISTEMA 3: APOGEE VIDEO PLAYER (Next.js + Fastify) ---
        
        # 1. Aplicação Next.js (Frontend)
        # O Next.js roda no PM2 na porta 3000 e responde em /apogee
        location /apogee {
            proxy_pass http://127.0.0.1:3000; # Mudei localhost para 127.0.0.1 para evitar problemas de DNS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Repassa o IP real para o Next.js
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Backend API (Fastify)
        # O Frontend chama /apogee/api, mas a API espera /api
        location /apogee/api/ { # Note a barra no final para casar corretamente
            # O rewrite remove /apogee/api e deixa só o restante
            rewrite ^/apogee/api/(.*)$ /api/$1 break;
            
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 3. Media (Vídeos - Alias direto para performance)
        # IMPORTANTE: Garanta que o usuário do Nginx tem permissão de leitura na pasta de rede/disco
        location /apogee/media/ {
            # Redireciona para a API, pois ela tem permissao de ler o disco G:
            rewrite ^/apogee/media/(.*)$ /media/$1 break;
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        # 4. Thumbnails (Redireciona para API pois ela gera/serve)
        location /apogee/thumbnails/ {
             rewrite ^/apogee/thumbnails/(.*)$ /thumbnails/$1 break;
             proxy_pass http://127.0.0.1:4000;
        }
	
	# Redirecionamento completo do Frontend e Backend para o Node
    	location /backup {
        	proxy_pass http://127.0.0.1:3200/backup;
	        proxy_http_version 1.1;
        	proxy_set_header Upgrade $http_upgrade;
	        proxy_set_header Connection 'upgrade';
        	proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
        	proxy_cache_bypass $http_upgrade;
	    }

        # --- SISTEMA 4: SHARESCREEN (Screen Share) ---
        # App: C:\Sistemas CGraf\Screen Share — start-producao.bat (porta 3443 HTTPS)
        # Host:  http://cgrafsysvm/host/
        # Meet:  http://cgrafsysvm/meet/  (clients)
        # Não usa /api no Nginx (/api já é do Controle OBS)

        location = /host {
            return 301 /host/;
        }

        location /host/ {
            proxy_pass https://sharescreen_node/host/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location = /meet {
            return 301 /meet/;
        }

        location /meet/ {
            proxy_pass https://sharescreen_node/client/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /shared/ {
            proxy_pass https://sharescreen_node/shared/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /vendor/ {
            proxy_pass https://sharescreen_node/vendor/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /ws {
            proxy_pass https://sharescreen_node/ws;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

    }

}
