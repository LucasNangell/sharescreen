# =============================================================================
# HTTPS apenas para ShareScreen (/host, /meet, /ws)
# Os demais sistemas (Sagra, OBS, Apogee, etc.) continuam em HTTP na porta 80.
#
# COMO USAR:
# 1. Gere os certificados (veja HTTPS-NGINX.md)
# 2. Ajuste os caminhos ssl_certificate abaixo
# 3. No nginx.conf, dentro de http { }, APÓS o bloco upstream sharescreen_node:
#      include "C:/Sistemas CGraf/Screen Share/nginx/https-sharescreen.conf";
# 4. No server { listen 80; ... } existente, substitua o bloco SISTEMA 4 por
#    o bloco "redirects HTTP -> HTTPS" que está no final deste arquivo.
# 5. nginx -t  &&  nginx -s reload
# =============================================================================

server {
    listen 443 ssl;
    server_name cgrafsysvm;

    ssl_certificate     C:/nginx/conf/ssl/cgrafsysvm.crt;
    ssl_certificate_key C:/nginx/conf/ssl/cgrafsysvm.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10M;

    # --- ShareScreen (HTTPS público) ---
    location = /host {
        return 301 /host/;
    }

    location /host/ {
        proxy_pass https://sharescreen_node/host/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /meet {
        return 301 /meet/;
    }

    location /meet/ {
        proxy_pass https://sharescreen_node/client/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /shared/ {
        proxy_pass https://sharescreen_node/shared/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /vendor/ {
        proxy_pass https://sharescreen_node/vendor/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws {
        proxy_pass https://sharescreen_node/ws;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

