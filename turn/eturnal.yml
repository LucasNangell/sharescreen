# ShareScreen — eturnal STUN/TURN (referencia para C:\eturnal\etc\eturnal.yml)
# Convidados externos: TURNS:443 via demux NGINX -> eturnal:5349
# LAN: WebRTC direto; TURN e fallback opcional (3478 interno)

eturnal:

  credentials:
    sharescreen: "ShareScreenTurn2026!"

  relay_ipv4_addr: "200.219.133.192"
  relay_min_port: 49160
  relay_max_port: 49252

  listen:
    - ip: "0.0.0.0"
      port: 3478
      transport: udp
    - ip: "0.0.0.0"
      port: 3478
      transport: tcp
    - ip: "0.0.0.0"
      port: 5349
      transport: tls

  tls_crt_file: "C:/nginx/conf/ssl/cgrafsysvm-leg-chain.crt"
  tls_key_file: "C:/nginx/conf/ssl/cgrafsysvm-leg.key"

  realm: "cgrafsysvm.camara.leg.br"

  blacklist_peers:
    - recommended

  strict_expiry: false

  log_level: info
  log_rotate_size: 10485760
  log_rotate_count: 10
  log_dir: "C:/Program Files/eturnal/log"
  run_dir: "C:/Program Files/eturnal/run"

  modules:
    mod_log_stun: {}
