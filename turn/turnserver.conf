# ShareScreen — coturn (TURN/STUN relay para espectadores externos)
# Ajuste external-ip antes de usar. Nao altere min-port/max-port sem liberar firewall.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# IP publico / IP privado do servidor (ex.: 200.219.133.192/10.1.1.73)
external-ip=200.219.133.192/10.1.1.73
relay-ip=10.1.1.73

# Faixa separada do mediasoup (40000-40100)
min-port=49160
max-port=49252

realm=cgrafsysvm.camara.leg.br
server-name=cgrafsysvm.camara.leg.br

fingerprint
lt-cred-mech
user=sharescreen:ShareScreenTurn2026!

no-multicast-peers
no-cli
verbose

# TLS (TURNS :5349) — certificado corporativo internet (cgrafsysvm.camara.leg.br)
# Caminhos absolutos no servidor de producao; fallback ../certs para dev local.
cert=C:/nginx/conf/ssl/cgrafsysvm-leg-chain.crt
pkey=C:/nginx/conf/ssl/cgrafsysvm-leg.key
# Dev local (descomente se nao houver cert leg):
# cert=../certs/server.crt
# pkey=../certs/server.key

# Opcional: logs
# log-file=../logs/turnserver.log
