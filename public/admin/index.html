<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Share Screen (temporário)</title>
  <link rel="icon" type="image/png" href="/shared/icons/logo.png" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/components.css" />
  <style>
    body { padding: var(--space-lg); max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin-bottom: var(--space-xs); }
    .admin-toolbar { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin: var(--space-md) 0; }
    .admin-table-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--color-border); text-align: left; vertical-align: middle; }
    th { background: var(--color-surface-2); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .field-inline input { width: 100%; min-width: 80px; padding: 0.35rem 0.5rem; font-size: 0.85rem;
      background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); }
    .lt-cell { min-width: 180px; }
    .lt-cell input[type=file] { font-size: 0.75rem; max-width: 160px; }
    .status-ok { color: var(--color-success); }
    .status-err { color: var(--color-danger); }
    #admin-status { margin-top: var(--space-md); font-size: 0.85rem; color: var(--color-text-muted); min-height: 1.2em; }
    .admin-note { color: var(--color-text-muted); font-size: 0.85rem; margin-bottom: var(--space-md); }
  </style>
</head>
<body>
  <h1>Administração (temporário)</h1>
  <p class="admin-note">Cadastro de usuários, IPs e Lower Third. Populado inicialmente a partir de <code>users.json</code>.</p>

  <div class="admin-toolbar">
    <button type="button" id="btn-reload" class="btn btn-secondary">Recarregar</button>
    <button type="button" id="btn-seed" class="btn btn-secondary">Importar users.json</button>
    <button type="button" id="btn-resolve" class="btn btn-primary">Resolver IPs (ping)</button>
    <button type="button" id="btn-add" class="btn btn-ghost">+ Novo usuário</button>
    <a href="/host" class="btn btn-ghost">Ir ao Host</a>
  </div>

  <div class="admin-table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Computer name</th>
          <th>IP</th>
          <th>Lower Third (.webm)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="users-body"></tbody>
    </table>
  </div>
  <div id="admin-status" role="status"></div>

  <script src="admin.js"></script>
</body>
</html>
